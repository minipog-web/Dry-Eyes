[build]
  publish = "."

# Force 301 redirect from Netlify default subdomain to primary custom domain
[[redirects]]
  from = "https://premium-dry-eye-treatment.netlify.app/*"
  to = "https://dryeye.maranoeye.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://premium-dry-eye-treatment.netlify.app/*"
  to = "https://dryeye.maranoeye.com/:splat"
  status = 301
  force = true

# Security headers & CSP
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://tagmanager.google.com https://*.google-analytics.com https://*.googleadservices.com https://googleads.g.doubleclick.net https://*.callrail.com https://cdn.callrail.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://*.googleadservices.com https://googleads.g.doubleclick.net https://stats.g.doubleclick.net https://*.callrail.com; frame-src 'self' https://www.googletagmanager.com https://www.google.com https://maps.google.com; object-src 'none'; base-uri 'self';"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure HTML entrypoint is revalidated
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
